plugins {
    id 'com.android.application'
}

// OBD-Fahr-Dashboard: die Oberfläche des OpenNextion-ELM327-Displays (LIVE / GRAPH / DTC / INFO) als
// Android-App, auf dem gemeinsamen, geprüften Kern :obdcore (Read-only-Allowlist, Parser, Diagnosen).
android {
    namespace = 'de.roman.obddashboard'
    // Android 17 QPR2 (SDK 37.2), neuestes stabiles Release (Stand 05.11.2026)
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }
    buildToolsVersion = '37.0.0'

    defaultConfig {
        applicationId = 'de.roman.obddashboard'
        minSdk = 26
        targetSdk = 37
        versionCode = 5
        versionName = '0.4.0'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        // Rein deutschsprachige App, Texte werden im Code gesetzt (wie :app).
        disable += 'SetTextI18n'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

dependencies {
    implementation project(':obdcore')
    testImplementation 'junit:junit:4.13.2'
}
