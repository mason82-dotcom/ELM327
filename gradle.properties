org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX only for the instrumented UI tests (androidTest); the apps themselves use no support library.
android.useAndroidX=true
android.nonTransitiveRClass=true

android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Reines Java-Projekt: AGP-9-Built-in-Kotlin abschalten, damit kotlin-stdlib nicht im APK landet.
android.builtInKotlin=false
