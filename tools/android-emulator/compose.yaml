name: android-emulator

# Android-17.2-Emulator (OBD Dashboard testen) mit ELM327-Laborsimulator.
# Browser: http://192.168.178.50:6081/vnc.html  ·  APK installieren: ./emu.sh install <apk>
services:
  emulator:
    build: .
    image: brix/android-emulator:37.2
    container_name: android-emulator
    restart: unless-stopped
    devices:
      - /dev/kvm:/dev/kvm
    # NET_ADMIN nur im eigenen Netz-Namensraum: setzt ::1 auf lo (siehe entrypoint.sh).
    cap_add:
      - NET_ADMIN
    environment:
      SCREEN: "1280x1000x24"
    volumes:
      - ${ANDROID_SDK_DIR:-/home/mason/android-sdk}:/sdk
      - emulator-data:/data
    ports:
      - "${EMU_BIND:-192.168.178.50}:${EMU_PORT:-6081}:6080"
    mem_limit: 6500m
    cpus: 3.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.centurylinklabs.watchtower.enable: "false"

volumes:
  emulator-data:
