plugins {
    id 'com.android.library'
}

// Gemeinsame Hilfen für die UI-Tests (androidTest) von :app und :dashboard: Warten auf Espresso-Bedingungen,
// Probe des ELM327-Simulators, Testargumente. Nur als androidTestImplementation eingebunden, nie in den Apps.
android {
    namespace = 'de.roman.testsupport'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }
    buildToolsVersion = '37.0.0'

    defaultConfig {
        minSdk = 26
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    api 'androidx.test:runner:1.7.0'
    api 'androidx.test:rules:1.7.0'
    api 'androidx.test.ext:junit:1.3.0'
    api 'androidx.test.espresso:espresso-core:3.7.0'
}
