name: Build Mercedes OBD2 Monitor APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # AGP 9.4 nutzt standardmäßig Build-Tools 36.0.0.
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"

      # Gradle-Version kommt aus dem Wrapper (gradle/wrapper/gradle-wrapper.properties).
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Mercedes_OBD2_Monitor_v1.0.9-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mercedes_OBD2_Monitor_v1.0.9-debug
          path: Mercedes_OBD2_Monitor_v1.0.9-debug.apk
