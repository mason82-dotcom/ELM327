name: Build Mercedes OBD2 Monitor and OBD Dashboard APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # Android 17 QPR2 (SDK 37.2) und Build-Tools 37.0.0, wie in den build.gradle-Dateien festgelegt.
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0"

      # Gradle-Version kommt aus dem Wrapper (gradle/wrapper/gradle-wrapper.properties).
      - uses: gradle/actions/setup-gradle@v4

      # Die geprüfte OBD-Logik und ihre Tests liegen in :obdcore; :app und :dashboard haben eigene Tests.
      - name: Unit tests
        run: ./gradlew :obdcore:testDebugUnitTest :app:testDebugUnitTest :dashboard:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew :obdcore:lintDebug :app:lintDebug :dashboard:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            obdcore/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.html
            dashboard/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build debug APKs
        run: ./gradlew :app:assembleDebug :dashboard:assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Mercedes_OBD2_Monitor_v1.2.1-debug.apk
          cp dashboard/build/outputs/apk/debug/dashboard-debug.apk OBD_Dashboard_v0.4.1-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mercedes_OBD2_Monitor_v1.2.1-debug
          path: Mercedes_OBD2_Monitor_v1.2.1-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OBD_Dashboard_v0.4.1-debug
          path: OBD_Dashboard_v0.4.1-debug.apk
