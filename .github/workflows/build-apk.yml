name: Build Mercedes OBD2 Monitor and OBD Dashboard APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          # Android 17 QPR2 (SDK 37.2) und Build-Tools 37.0.0, wie in den build.gradle-Dateien festgelegt.
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;37.0.0"

      # Fester Signaturschlüssel (Updates ohne Deinstallation, siehe build.gradle) – nur für main und manuelle Läufe:
      # ungeprüfter PR-Code darf nie als Update über die App im Auto installierbar sein.
      - name: Signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ELM327_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/elm327.keystore"
          else
            echo "::warning::Secret ELM327_KEYSTORE_B64 fehlt – APKs mit Zufalls-Debug-Schlüssel, nicht als Update installierbar"
          fi

      # Gradle-Version kommt aus dem Wrapper (gradle/wrapper/gradle-wrapper.properties).
      - uses: gradle/actions/setup-gradle@v4

      # Die geprüfte OBD-Logik und ihre Tests liegen in :obdcore; :app und :dashboard haben eigene Tests.
      - name: Unit tests
        run: ./gradlew :obdcore:testDebugUnitTest :app:testDebugUnitTest :dashboard:testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew :obdcore:lintDebug :app:lintDebug :dashboard:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            obdcore/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.html
            dashboard/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Build debug APKs
        # assembleDebugAndroidTest: UI-Tests mitkompilieren (ausgeführt werden sie im Emulator, tools/android-emulator)
        # Schlüssel und Passwörter nur in diesem Schritt und nicht für Pull Requests
        env:
          ELM327_KEYSTORE: ${{ github.event_name != 'pull_request' && secrets.ELM327_KEYSTORE_B64 != '' && format('{0}/elm327.keystore', runner.temp) || '' }}
          ELM327_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ELM327_KEYSTORE_PASSWORD || '' }}
          ELM327_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ELM327_KEY_PASSWORD || '' }}
        run: ./gradlew :app:assembleDebug :dashboard:assembleDebug :app:assembleDebugAndroidTest :dashboard:assembleDebugAndroidTest --stacktrace

      - name: Show signing certificate
        # nur der öffentliche Fingerabdruck: gleich bleibend = Updates möglich
        shell: bash
        run: |
          "${ANDROID_SDK_ROOT}/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | grep -m1 'SHA-256' || true

      - name: Rename APKs
        id: apk
        # Version aus build.gradle lesen (vorher fest v1.4.0/v0.8.0 und dadurch seit 1.5.0 falsch benannt)
        run: |
          app_v=$(sed -n "s/^ *versionName = '\(.*\)'.*/\1/p" app/build.gradle)
          dash_v=$(sed -n "s/^ *versionName = '\(.*\)'.*/\1/p" dashboard/build.gradle)
          test -n "$app_v" && test -n "$dash_v"
          echo "app=Mercedes_OBD2_Monitor_v${app_v}-debug" >> "$GITHUB_OUTPUT"
          echo "dash=OBD_Dashboard_v${dash_v}-debug" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "Mercedes_OBD2_Monitor_v${app_v}-debug.apk"
          cp dashboard/build/outputs/apk/debug/dashboard-debug.apk "OBD_Dashboard_v${dash_v}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.app }}
          path: ${{ steps.apk.outputs.app }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.dash }}
          path: ${{ steps.apk.outputs.dash }}.apk
