plugins {
    id 'com.android.application'
}

android {
    namespace = 'de.roman.mercedesobdmonitor'
    // Android 17 QPR2 (SDK 37.2), neuestes stabiles Release (Stand 05.11.2026)
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }
    buildToolsVersion = '37.0.0'

    defaultConfig {
        applicationId = 'de.roman.mercedesobdmonitor'
        minSdk = 26
        targetSdk = 37
        versionCode = 14
        versionName = '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        // Die App ist bewusst rein deutschsprachig; UI-Texte werden im Code gesetzt.
        disable += 'SetTextI18n'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}

dependencies {
    implementation project(':obdcore')
    testImplementation 'junit:junit:4.13.2'
}
